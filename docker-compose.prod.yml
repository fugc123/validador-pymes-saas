version: '3.8'

services:
  # =========================================================================
  # 1. Base de Datos PostgreSQL 16
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cajasegura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-validador_saas}
      POSTGRES_USER: ${DB_USER:-cajasegura_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cajasegura_secure_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cajasegura_admin} -d ${DB_NAME:-validador_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cajasegura-network

  # =========================================================================
  # 2. Backend NestJS (Producción)
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cajasegura-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-cajasegura_admin}
      DB_PASSWORD: ${DB_PASSWORD:-cajasegura_secure_pass_2026}
      DB_NAME: ${DB_NAME:-validador_saas}
      JWT_SECRET: ${JWT_SECRET:-cajasegura_prod_secret_jwt_2026_super_key}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - cajasegura-network

  # =========================================================================
  # 3. Frontend Web (Nginx SPA + Reverse Proxy)
  # =========================================================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cajasegura-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - cajasegura-network

networks:
  cajasegura-network:
    driver: bridge

volumes:
  pgdata:
    name: cajasegura_pgdata
