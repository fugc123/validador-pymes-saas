name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install client dependencies
        working-directory: client
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Type check
        run: npx tsc --noEmit

      - name: Backend build
        run: npm run build

      - name: Client build
        working-directory: client
        run: npm run build
